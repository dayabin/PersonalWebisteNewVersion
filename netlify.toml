[build]
  command = "pnpm run check && pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/uploads/resume.pdf"
  to = "/uploads/yabinda.pdf"
  status = 301
  force = true
